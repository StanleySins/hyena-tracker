ze:12px;color:var(--muted);margin-top:3px}.pts{font-weight:750;color:var(--accent);font-size:13px}.progress{height:8px;border-radius:20px;background:var(--line);overflow:hidden;margin-top:9px}.fill{height:100%;background:var(--accent);border-radius:20px;transition:width .2s}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.date{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);max-width:180px}.scoreinput{width:78px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}.small{font-size:12px}.space{margin-top:16px}.notice{padding:11px 13px;border:1px solid var(--line);border-radius:11px;font-size:12px;color:var(--muted);margin-top:13px}.chart{width:100%;height:230px}.chart svg{width:100%;height:100%}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.formrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}.formrow label{font-size:12px;color:var(--muted)}.formrow input,.formrow select{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}.listrow{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:11px 0;gap:8px}.listrow:last-child{border:0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border:1px solid var(--line);border-radius:8px;padding:9px 3px;text-align:center;font-size:12px;min-height:52px}.day.reported{background:var(--soft)}.day.today{border:2px solid var(--accent)}.day small{display:block;color:var(--muted);margin-top:3px}.hidden{display:none!important}.auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.auth input{width:145px;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink)}.actions{display:flex;gap:8px;flex-wrap:wrap}.error{color:#d46a62}.tag{font-size:11px;color:var(--muted);background:var(--bg);padding:4px 7px;border-radius:6px}.quote{font-size:13px;color:var(--muted);font-style:italic;margin-top:10px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{grid-template-columns:1fr}.shell{padding:16px 12px 60px}.card{padding:15px}.metric .num{font-size:25px}.brand{font-size:19px}.formrow{grid-template-columns:1fr}.auth input{width:120px}}
</style></head><body><div class="shell"><header class="top"><div><div class="brand">◈ Personal Development</div><div class="subtitle">You can suck, but you cannot skip.</div></div><div class="auth" id="auth"></div></header><div class="tabs" id="tabs"><button class="tab active" data-tab="today">Today</button><button class="tab" data-tab="insights">Insights</button><button class="tab" data-tab="history">History</button><button class="tab" data-tab="settings">Habits & Settings</button></div><div id="app"></div></div><script type="module">
import {createOneDrive} from './onedrive.js';
const CLIENT_ID = '6e299516-bde6-4a58-a13b-7ab64b04ea08'; // Public Application (client) ID from Microsoft Entra.
const TZ='Europe/Sofia',TRIAL_START='2026-11-23',OFFICIAL='2026-12-01';
const seed=[
{id:'alcohol',name:'Alcohol-free',category:'Discipline',type:'daily',points:40,priority:true},
{id:'smoke',name:'Smoke-free',category:'Discipline',type:'daily',points:10},
{id:'sleep',name:'Fitbit Sleep Score',category:'Health',type:'sleep',points:15},
{id:'planning',name:'Daily planning',category:'Discipline',type:'weekday',points:20},
{id:'exercise',name:'Exercise',category:'Health',type:'weekly',quota:3,points:20},
{id:'yoga',name:'Yoga / mobility',category:'Health',type:'weekly',quota:1,points:15,hint:'Thursday preferred'},
{id:'legs',name:'Legs up the wall',category:'Health',type:'weekly',quota:3,points:5,hint:'3–5 minutes'},
{id:'learning',name:'Personal development',category:'Growth',type:'weekly',quota:3,points:15,hint:'30 minutes'},
{id:'meditation',name:'Meditation / mindfulness',category:'Health',type:'weekly',quota:2,points:10},
{id:'church',name:'Go to church',category:'Growth',type:'weekly',quota:1,points:20},
{id:'meeting',name:'New business meeting',category:'Business',type:'weekly',quota:1,points:20},
{id:'homeDrums',name:'Home drum practice',category:'Hobbies',type:'weekly',quota:3,points:10},
{id:'studioDrums',name:'Studio drum set',category:'Hobbies',type:'weekly',quota:1,points:20},
{id:'read',name:'Read a book',category:'Growth',type:'bonus',quota:1,points:5},
{id:'walk',name:'Intentional walk outdoors',category:'Health',type:'bonus',quota:1,points:5},
{id:'family',name:'Dedicated family activity',category:'Growth',type:'bonus',quota:1,points:10},
{id:'review',name:'Weekly review & planning',category:'Discipline',type:'weeklybonus',quota:1,points:15},
{id:'kindness',name:'Kindness or volunteering',category:'Growth',type:'bonus',quota:1,points:10},
{id:'custom',name:'Custom bonus activity',category:'Growth',type:'bonus',quota:1,points:5}
];
const sauna = {id:'sauna',name:'Sauna',category:'Health',type:'weekly',quota:1,points:15,created:'2026-11-24'};
const localKey = 'habit_tracker_v1';
const stateDefault = () => ({habits:seed.map(h => ({...h,created:TRIAL_START})),entries:{},changes:[],version:1});
function normalizeState(data) {
  if (!data || !Array.isArray(data.habits) || !data.entries || Array.isArray(data.entries) ||
      typeof data.entries !== 'object' || (data.changes != null && !Array.isArray(data.changes))) {
    throw Error('Invalid tracker backup.');
  }
  if (!data.habits.some(h => h.id === sauna.id)) {
    data.habits.push({...sauna});
  }
  data.changes ??= [];
  return data;
}
function readLocal(key) {
  try {
    return JSON.parse(localStorage.getItem(key));
  } catch {
    return null;
  }
}
let state = normalizeState(readLocal(localKey) || stateDefault());
let tab='today',selectedDate=sofiaToday();
let drive, account, record, accountKey, syncTimer, busy = false, authBusy = false;
let status = CLIENT_ID ? 'Local only' : 'Local only · OneDrive setup required';
function sofiaToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function parse(d){return new Date(d+'T12:00:00Z')};function dayOffset(d,n){const x=parse(d);x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function weekStart(d){return dayOffset(d,-((parse(d).getUTCDay()+6)%7))}function weekDates(d){return Array.from({length:7},(_,i)=>dayOffset(weekStart(d),i))}
function isWeekday(d){let x=parse(d).getUTCDay();return x>=1&&x<=5}function active(h,d){return (!h.created||d>=h.created)&&(!h.archivedAt||d<h.archivedAt)&&(!h.pausedFrom||d<h.pausedFrom)}
function rule(h,d){let changes=(state.changes||[]).filter(c=>c.id===h.id&&c.from<=d).sort((a,b)=>a.from.localeCompare(b.from));return {...h,...(changes.at(-1)?.values||{})}}
function valid(h,d){return active(h,d)&&d>=TRIAL_START&& (h.type!=='weekday'||isWeekday(d))}
function entry(d){return state.entries[d]||{checks:{},sleep:null,reported:false}}
function checked(d,id){return entry(d).checks?.[id]===true}function sleepPoints(n){return n===null||n===''||!Number.isFinite(+n)?0:+n>=75?15:+n>=65?10:+n>=55?5:+n>=45?2:0}
function countWeek(h,d){return weekDates(d).filter(x=>x<=d&&valid(h,x)&&checked(x,h.id)).length}
function pointsFor(h,d){if(!valid(h,d))return 0;let r=rule(h,d);if(r.type==='sleep')return sleepPoints(entry(d).sleep);if(!checked(d,h.id))return 0;if(r.type==='weekly'||r.type==='weeklybonus'){let n=weekDates(d).filter(x=>x<=d&&checked(x,h.id)).length;return n>r.quota?(r.type==='weeklybonus'?0:r.points*.5):r.points}return r.points}
function dayPoints(d){return state.habits.reduce((s,h)=>s+pointsFor(h,d),0)}
function reported(d){return !!entry(d).reported}
function perfect(d){return reported(d)&&checked(d,'alcohol')&&checked(d,'smoke')&&+entry(d).sleep>=75&&(!isWeekday(d)||checked(d,'planning'))}
function weekStats(d){let days=weekDates(d).filter(x=>x>=TRIAL_START&&x<=sofiaToday());let core=state.habits.filter(h=>['daily','weekday','sleep','weekly'].includes(h.type));let max=0,earned=0;for(let h of core){let dates=days.filter(x=>valid(h,x));if(!dates.length)continue;let r=rule(h,dates[0]);if(r.type==='weekly'){let q=Math.min(r.quota,dates.length);max+=q*r.points;earned+=Math.min(q,dates.filter(x=>checked(x,h.id)).length)*r.points}else{for(let x of dates){if(!reported(x))continue;let rx=rule(h,x);max+=rx.points;earned+=Math.min(rx.points,pointsFor(h,x))}}}return {pct:max?Math.round(100*earned/max):0,earned,max,reported:days.filter(reported).length,total:days.length}}
function officialPoints(){return Object.keys(state.entries).filter(d=>d>=OFFICIAL&&reported(d)).reduce((s,d)=>s+dayPoints(d),0)}
function streak(){let d=sofiaToday(),n=0;if(!reported(d)||!checked(d,'alcohol'))d=dayOffset(d,-1);while(d>=TRIAL_START&&reported(d)&&checked(d,'alcohol')){n++;d=dayOffset(d,-1)}return n}
function rank(points){return points>=10000?'Diamond':points>=6000?'Platinum':points>=3000?'Gold':points>=1000?'Silver':'Bronze'}
function monthPoints(d){return Object.keys(state.entries).filter(x=>x.slice(0,7)===d.slice(0,7)&&x>=OFFICIAL&&reported(x)).reduce((s,x)=>s+dayPoints(x),0)}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persistAccount() {
  localStorage.setItem(accountKey, JSON.stringify(record));
}
function save() {
  if (!account) {
    localStorage.setItem(localKey, JSON.stringify(state));
    return;
  }
  record.data = state;
  record.pending = true;
  persistAccount();
  status = 'Saved on this device · OneDrive pending';
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, 600);
}
function updateCheck(d,id,val){let e=state.entries[d]||{checks:{},sleep:null,reported:false};e.checks[id]=val;e.reported=true;state.entries[d]=e;save();render()}
function updateSleep(d,val){let e=state.entries[d]||{checks:{},sleep:null,reported:false};e.sleep=val===''?null:Math.max(0,Math.min(100,Number(val)));e.reported=true;state.entries[d]=e;save();render()}
function markReported(d){let e=state.entries[d]||{checks:{},sleep:null,reported:false};e.reported=!e.reported;state.entries[d]=e;save();render()}
function metric(name,value,sub=''){return `<div class="card metric"><div class="name">${name}</div><div class="num">${value}</div><div class="small muted">${sub}</div></div>`}
function habitRow(h,d){let r=rule(h,d),n=r.type==='weekly'||r.type==='weeklybonus'?countWeek(h,d):null;return `<label class="habit"><input type="checkbox" data-check="${escapeHTML(h.id)}" ${checked(d,h.id)?'checked':''}><span class="grow"><div class="name">${escapeHTML(r.name)}</div><div class="hint">${r.hint?escapeHTML(r.hint)+' · ':''}${n!==null?`${n}/${escapeHTML(r.quota)} this week`:(r.type==='weekday'?'Weekdays':r.type==='bonus'?'Optional':'Daily')}</div></span><span class="pts">+${escapeHTML(pointsFor(h,d)||r.points)}</span></label>`}
function todayView(){let d=selectedDate,ws=weekStats(d),e=entry(d),core=state.habits.filter(h=>valid(h,d)&&['daily','weekday','sleep'].includes(h.type)),weekly=state.habits.filter(h=>valid(h,d)&&h.type==='weekly'),bonus=state.habits.filter(h=>valid(h,d)&&['bonus','weeklybonus'].includes(h.type));let score=dayPoints(d);return `<div class="row"><div><h2 style="margin:0">Daily check-in</h2><div class="subtitle">Bulgaria time · ${d>=OFFICIAL?'Official tracking':'Trial period'}</div></div><input class="date" id="date" type="date" min="${TRIAL_START}" max="${sofiaToday()}" value="${d}"></div><div class="grid space">${metric('Today’s points',score+' / 100',score>=100?'Target achieved':'Daily benchmark')}${metric('Weekly discipline',ws.pct+'%',`${ws.reported}/${ws.total} days reported`)}${metric('Alcohol-free streak',streak()+' days','Verified reports only')}${metric('Lifetime level',rank(officialPoints()),officialPoints()+' official pts')}</div><div class="main"><div><div class="card"><div class="row"><h3 class="heading">Daily commitments</h3><span class="pill">${perfect(d)?'★ Perfect Day':'In progress'}</span></div>${core.filter(h=>h.type!=='sleep').map(h=>habitRow(h,d)).join('')}<div class="habit"><span class="grow"><div class="name">Fitbit Sleep Score</div><div class="hint">75+ earns full 15 points</div></span><input class="scoreinput" id="sleep" type="number" min="0" max="100" placeholder="0–100" value="${escapeHTML(e.sleep??'')}"><span class="pts">+${sleepPoints(e.sleep)}</span></div><div class="row space"><span class="small muted">${reported(d)?'Day reported':'Day not reported yet'}</span><button class="btn" id="report">${reported(d)?'Mark unreported':'Mark day reported'}</button></div></div><div class="card space"><h3 class="heading">Flexible weekly habits</h3>${weekly.map(h=>habitRow(h,d)).join('')}</div><div class="card space"><h3 class="heading">Optional bonuses</h3>${bonus.map(h=>habitRow(h,d)).join('')}</div></div><div><div class="card"><h3 class="heading">Weekly progress</h3>${weekly.map(h=>{let r=rule(h,d),n=countWeek(h,d);return `<div style="margin-bottom:15px"><div class="row small"><strong>${escapeHTML(r.name)}</strong><span>${n}/${escapeHTML(r.quota)}</span></div><div class="progress"><div class="fill" style="width:${Math.min(100,100*n/r.quota)}%"></div></div></div>`}).join('')}<div class="notice">Smart suggestion: ${suggestion(d)}</div></div><div class="card space"><h3 class="heading">Scoring rules</h3><div class="small muted">Weekly quotas are flexible. Extra completions earn 50% points. Unreported days are not treated as failures. Perfect Day requires alcohol-free, smoke-free, Fitbit 75+, and weekday planning.</div><div class="quote">“You can suck, but you cannot skip.”</div></div></div></div><div id="status" class="small muted space"></div>`}
function suggestion(d){let weekly=state.habits.filter(h=>h.type==='weekly'&&valid(h,d)).map(h=>({h,r:rule(h,d),n:countWeek(h,d)})).filter(x=>x.n<x.r.quota);if(!weekly.length)return 'All weekly quotas completed — great work.';let remain=Math.max(1,7-((parse(d).getUTCDay()+6)%7));weekly.sort((a,b)=>(b.r.quota-b.n)/remain-(a.r.quota-a.n)/remain);let x=weekly[0];return `Consider ${x.r.name.toLowerCase()} (${x.n}/${x.r.quota}). ${remain} day(s) left this week.`}
function chartSvg(data,key,color){let w=620,h=210,p=28,max=Math.max(100,...data.map(x=>x[key]||0)),step=(w-2*p)/Math.max(1,data.length-1);let pts=data.map((x,i)=>[p+i*step,h-p-(x[key]||0)/max*(h-2*p)]);let path=pts.map((v,i)=>(i?'L':'M')+v[0].toFixed(1)+' '+v[1].toFixed(1)).join(' ');return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Progress line chart"><line x1="${p}" x2="${w-p}" y1="${h-p}" y2="${h-p}" stroke="var(--line)"/><line x1="${p}" x2="${w-p}" y1="${h/2}" y2="${h/2}" stroke="var(--line)" stroke-dasharray="4 5"/><path d="${path}" stroke="${color}" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((v,i)=>`<circle cx="${v[0]}" cy="${v[1]}" r="3.5" fill="${color}"><title>${data[i].label}: ${data[i][key]}</title></circle>`).join('')}<text x="${p}" y="${h-4}" fill="var(--muted)" font-size="12">${escapeHTML(data[0]?.label||'')}</text><text x="${w-p}" y="${h-4}" fill="var(--muted)" font-size="12" text-anchor="end">${escapeHTML(data.at(-1)?.label||'')}</text></svg>`}
function insightsView(){let today=sofiaToday(),weeks=Array.from({length:8},(_,i)=>dayOffset(today,-7*(7-i))).map(d=>({label:weekStart(d).slice(5),discipline:weekStats(d).pct,points:weekDates(d).filter(x=>reported(x)).reduce((s,x)=>s+dayPoints(x),0)}));let cats=['Health','Discipline','Growth','Business','Hobbies'];let catRows=cats.map(cat=>{let h=state.habits.filter(x=>x.category===cat&&['daily','weekday','sleep','weekly'].includes(x.type)),dates=weekDates(today).filter(x=>x<=today&&x>=TRIAL_START);let earned=0,max=0;for(let x of h){let r=rule(x,today);if(x.type==='weekly'){max+=r.quota*r.points;earned+=Math.min(r.quota,dates.filter(d=>checked(d,x.id)).length)*r.points}else{for(let d of dates.filter(d=>reported(d)&&valid(x,d))){max+=r.points;earned+=Math.min(r.points,pointsFor(x,d))}}}return {cat,pct:max?Math.round(100*earned/max):0}});let sleeps=Object.keys(state.entries).filter(x=>entry(x).sleep!==null&&entry(x).sleep!==undefined).sort().slice(-14).map(x=>({label:x.slice(5),score:+entry(x).sleep}));return `<h2>Insights & progress</h2><div class="grid">${metric('Official lifetime',officialPoints()+' pts',rank(officialPoints()))}${metric('This month',monthPoints(today)+' pts','Monthly rank: '+rank(monthPoints(today)))}${metric('Alcohol-free streak',streak()+' days','Priority habit')}${metric('Perfect days',Object.keys(state.entries).filter(perfect).length,'Recorded history')}</div><div class="main"><div><div class="card"><h3 class="heading">Weekly weighted discipline</h3><div class="chart">${chartSvg(weeks,'discipline','var(--accent)')}</div></div><div class="card space"><h3 class="heading">Weekly achievement points</h3><div class="chart">${chartSvg(weeks,'points','var(--gold)')}</div></div><div class="card space"><h3 class="heading">Fitbit Sleep Score</h3>${sleeps.length?`<div class="chart">${chartSvg(sleeps,'score','var(--accent)')}</div>`:'<div class="muted small">Enter your first sleep score to see this chart.</div>'}</div></div><div><div class="card"><h3 class="heading">This week by category</h3>${catRows.map(x=>`<div style="margin-bottom:17px"><div class="row small"><strong>${x.cat}</strong><span>${x.pct}%</span></div><div class="progress"><div class="fill" style="width:${x.pct}%"></div></div></div>`).join('')}<div class="notice">Current-week category scores are provisional until the week ends. Unreported days are excluded from daily-habit calculations.</div></div><div class="card space"><h3 class="heading">Achievements</h3><div class="small">${streak()>=7?'🏅 7-day alcohol-free streak':'🔒 7-day alcohol-free streak'}<br><br>${Object.keys(state.entries).filter(perfect).length>=1?'🏅 First Perfect Day':'🔒 First Perfect Day'}<br><br>${officialPoints()>=1000?'🏅 Silver Level':'🔒 Silver Level (1,000 pts)'}</div></div></div></div>`}
function historyView(){let today=sofiaToday(),days=Array.from({length:35},(_,i)=>dayOffset(today,i-34)).filter(x=>x>=TRIAL_START);return `<h2>History</h2><div class="card"><h3 class="heading">Last 35 days</h3><div class="calendar">${days.map(d=>`<button class="day ${reported(d)?'reported':''} ${d===today?'today':''}" data-date="${escapeHTML(d)}">${d.slice(8)}<small>${reported(d)?dayPoints(d)+' pts':'—'}</small></button>`).join('')}</div><div class="notice">Tap any date to edit its history. Green indicates reported, not necessarily successful. All earlier dates can be accessed with the date picker on the Today tab.</div></div><div class="card space"><h3 class="heading">Recent reported days</h3>${Object.keys(state.entries).filter(reported).sort().reverse().slice(0,25).map(d=>`<div class="listrow"><span>${escapeHTML(d)} ${perfect(d)?'★':''}</span><span><strong>${dayPoints(d)} pts</strong> <button class="btn" data-date="${escapeHTML(d)}">Edit</button></span></div>`).join('')||'<div class="muted">No reported days yet.</div>'}</div>`}
function settingsView(){return `<h2>Habits & Settings</h2><div class="main"><div><div class="card"><h3 class="heading">Your habits</h3>${state.habits.filter(h=>!h.archivedAt).map(h=>{let r=rule(h,sofiaToday());return `<div class="listrow"><div><strong>${escapeHTML(r.name)}</strong><div class="small muted">${escapeHTML(r.category)} · ${escapeHTML(r.type)}${r.quota?' · '+escapeHTML(r.quota)+'× weekly':''} · ${escapeHTML(r.points)} pts</div></div><div class="actions"><button class="btn" data-edit="${escapeHTML(h.id)}">Edit</button><button class="btn" data-archive="${escapeHTML(h.id)}">Archive</button></div></div>`}).join('')}</div></div><div><div class="card"><h3 class="heading">Add or edit habit</h3><form id="habitForm"><input type="hidden" name="id" id="habitId"><div class="formrow"><label>Name<input required name="name" id="habitName" placeholder="New habit"></label><label>Category<select name="category" id="habitCategory">${['Health','Discipline','Growth','Business','Hobbies'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Frequency<select name="type" id="habitType"><option value="daily">Daily</option><option value="weekday">Mon–Fri</option><option value="weekly">Weekly quota</option><option value="bonus">Optional bonus</option><option value="weeklybonus">Weekly bonus</option></select></label><label>Weekly target<input name="quota" id="habitQuota" type="number" min="1" max="7" value="1"></label><label>Points<input name="points" id="habitPoints" type="number" min="0" max="100" value="10"></label><label>Notes<input name="hint" id="habitHint" placeholder="Optional"></label></div><button class="btn primary" type="submit">Save habit</button> <button class="btn" type="reset">Clear</button></form><div class="notice">Edits are effective today; older records keep their original point values. Archived habits remain in history.</div></div><div class="card space"><h3 class="heading">Backup & portability</h3><div class="actions"><button class="btn" id="export">Export JSON</button><label class="btn">Import JSON<input id="import" type="file" accept="application/json" class="hidden"></label></div><div class="notice">Export regularly as a backup. Connect a personal Microsoft account to sync through OneDrive.</div></div><div class="card space"><h3 class="heading">Planned features</h3><div class="small muted">21:00 Bulgaria-time reminder, automatic Fitbit sync, and push notifications are not yet enabled.</div></div></div></div>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('app').innerHTML=({today:todayView,insights:insightsView,history:historyView,settings:settingsView}[tab])();renderAuth();bind()}
function bind(){document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>updateCheck(selectedDate,x.dataset.check,x.checked));let date=document.getElementById('date');if(date)date.onchange=()=>{selectedDate=date.value;render()};let sleep=document.getElementById('sleep');if(sleep)sleep.onchange=()=>updateSleep(selectedDate,sleep.value);let report=document.getElementById('report');if(report)report.onclick=()=>markReported(selectedDate);document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;tab='today';render()});document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>{if(!confirm('Archive this habit from today onward?'))return;let h=state.habits.find(x=>x.id===b.dataset.archive);h.archivedAt=sofiaToday();save();render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let h=state.habits.find(x=>x.id===b.dataset.edit),r=rule(h,sofiaToday());for(let k of ['id','name','category','type','quota','points','hint']){let el=document.getElementById('habit'+k[0].toUpperCase()+k.slice(1));if(el)el.value=r[k]??''}document.getElementById('habitForm').scrollIntoView({behavior:'smooth'})});let form=document.getElementById('habitForm');if(form)form.onsubmit=e=>{e.preventDefault();let f=new FormData(form),id=f.get('id')||('custom_'+Date.now()),values={name:f.get('name'),category:f.get('category'),type:f.get('type'),quota:Math.max(1,+f.get('quota')||1),points:Math.max(0,+f.get('points')||0),hint:f.get('hint')};if(state.habits.some(h=>h.id===id)){state.changes.push({id,from:sofiaToday(),values})}else state.habits.push({id,...values,created:sofiaToday()});save();render()};let ex=document.getElementById('export');if(ex)ex.onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='habit-tracker-backup.json';a.click();URL.revokeObjectURL(a.href)};let imp=document.getElementById('import');if(imp)imp.onchange=async()=>{try{let s=normalizeState(JSON.parse(await imp.files[0].text()));if(confirm('Replace current tracker data with this backup?')){state=s;save();render()}}catch(e){alert(e.message)}}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
function renderAuth() {
  const el = document.getElementById('auth');
  el.innerHTML = `<span class="pill" role="status">${escapeHTML(status)}</span>`;
  if (!drive || authBusy) return;
  if (!account) {
    addAuthButton(el, 'Connect OneDrive', () => authenticate(false));
    return;
  }
  addAuthButton(el, 'Sync now', () => sync(true), busy);
  addAuthButton(el, 'Sign out', signOut, busy);
}
function addAuthButton(container, label, action, disabled = false) {
  const button = document.createElement('button');
  button.className = 'btn';
  button.textContent = label;
  button.disabled = disabled;
  button.onclick = action;
  container.append(button);
}
async function authenticate(renew) {
  authBusy = true;
  renderAuth();
  try {
    await drive.connect(renew ? account : null);
  } catch {
    status = 'Microsoft sign-in could not start';
  } finally {
    authBusy = false;
    renderAuth();
  }
}
async function signOut() {
  clearTimeout(syncTimer);
  authBusy = true;
  renderAuth();
  try {
    await drive.disconnect(account);
  } catch {
    status = 'Sign-out could not start';
  } finally {
    authBusy = false;
    renderAuth();
  }
}
async function sync(interactive = false) {
  if (!account || busy || authBusy) return;
  busy = true;
  status = 'Checking OneDrive…';
  renderAuth();
  let rerun = false;
  try {
    const token = await drive.token(account);
    const path = await drive.filePath(token);
    const remote = await drive.metadata(token, path);
    let refresh = false;
    if (!record.initialized && !remote && !record.pending) {
      const local = readLocal(localKey);
      if (local && confirm('Use your existing local tracker as the starting copy in OneDrive?')) {
        record.data = state = normalizeState(local);
        refresh = true;
      }
      record.pending = true;
      persistAccount();
      if (refresh) render();
    }
    if (record.pending) {
      if ((remote?.eTag ?? null) !== record.eTag) {
        status = 'OneDrive changed · local edits retained';
        if (!interactive || !confirm('OneDrive has a different copy. Load it and replace this device’s unsynced edits? Cancel to keep your edits. Export them from Habits & Settings before replacing them.')) return;
        const before = JSON.stringify(state);
        const next = remote ? normalizeState(await drive.download(remote)) : normalizeState(stateDefault());
        if (before !== JSON.stringify(state)) return;
        record.data = state = next;
        record.eTag = remote?.eTag ?? null;
        record.pending = false;
        record.initialized = true;
        persistAccount();
        status = remote ? 'OneDrive synced' : 'OneDrive copy removed';
        render();
        return;
      }
      const payload = JSON.stringify(state);
      record.eTag = await drive.upload(token, path, payload, remote);
      record.pending = payload !== JSON.stringify(state);
      rerun = record.pending;
    } else if (remote && remote.eTag !== record.eTag) {
      const next = normalizeState(await drive.download(remote));
      if (record.pending) {
        rerun = true;
        return;
      }
      record.data = state = next;
      record.eTag = remote.eTag;
      refresh = true;
    } else if (!remote && record.eTag) {
      status = 'OneDrive copy missing · local copy retained';
      return;
    }
    record.initialized = true;
    persistAccount();
    status = record.pending ? 'Saved on this device · OneDrive pending' : record.eTag ? 'OneDrive synced' : 'OneDrive is empty';
    if (refresh) render();
  } catch (error) {
    if (drive.needsSignIn(error)) {
      status = 'Microsoft sign-in required · local copy retained';
      if (interactive) await authenticate(true);
    } else {
      status = 'OneDrive sync failed · local copy retained';
      console.warn('Hyena Tracker sync:', error.message);
    }
  } finally {
    busy = false;
    renderAuth();
    if (rerun) syncTimer = setTimeout(sync, 600);
  }
}
async function startOneDrive() {
  if (!CLIENT_ID || window.parent !== window) return;
  status = 'Connecting to Microsoft…';
  renderAuth();
  try {
    drive = await createOneDrive(CLIENT_ID);
    account = drive.account();
    if (!account) {
      status = 'Local only';
      return;
    }
    accountKey = localKey + ':' + account.homeAccountId;
    record = readLocal(accountKey) || {eTag:null,pending:false,initialized:false,data:stateDefault()};
    record.data = state = normalizeState(record.data);
    render();
    await sync();
    window.addEventListener('online', () => sync());
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') sync();
    });
  } catch {
    status = 'Microsoft connection failed';
  } finally {
    renderAuth();
  }
}
render();
startOneDrive();
</script></body></html>
